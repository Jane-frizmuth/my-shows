
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171620">
    <title>My Shows</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header class="app-header">
        <div>
            <p class="eyebrow">TON UNIVERS SÉRIES</p>
            <h1>My Shows <span>✦</span></h1>
        </div>
        <button class="profile-button" aria-label="Profil">♡</button>
    </header>

    <main>

        <section class="upcoming-section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">NE RIEN MANQUER</p>
                    <h2>À venir</h2>
                </div>
                <button class="text-button" data-page="calendar">
                    Tout voir →
                </button>
            </div>

            <div id="upcoming-list" class="upcoming-list">
                <p class="empty-message">
                    Tes prochaines sorties apparaîtront ici.
                </p>
            </div>
        </section>

        <section class="library-section">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">TON SUIVI</p>
                    <h2>Ma bibliothèque</h2>
                </div>
                <span id="series-count" class="count">0 série</span>
            </div>
<button id="import-library-button" class="text-button" style="margin: 12px 0;">
    Importer ma bibliothèque
</button>

<input
    type="file"
    id="import-library-file"
    accept=".json,application/json"
    style="display: none;"
>


            <div id="series-list">
                <p class="empty-message">
                    Ta bibliothèque t'attend 💜
                </p>
            </div>
       
        </section>

        <section id="calendar-page" class="calendar-page" style="display: none;">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">TON PROGRAMME</p>
                    <h2>Calendrier 📅</h2>
                </div>
            </div>

            <div id="calendar-list">
                <p class="empty-message">
                    Tes prochaines sorties apparaîtront ici 💜
                </p>
            </div>
        </section>

    </main>


    <nav class="bottom-nav">
        <button class="nav-button active" data-page="home">
            <span>⌂</span>
            Accueil
        </button>
        <button class="nav-button" data-page="discover">
            <span>⌕</span>
            Découvrir
        </button>
        <button class="nav-button" data-page="calendar">
            <span>▦</span>
            Calendrier
        </button>
        <button class="nav-button" data-page="stats">
            <span>▥</span>
            Stats
        </button>
    </nav>

    <script src="./app.js" defer></script>
</body>
</html>
